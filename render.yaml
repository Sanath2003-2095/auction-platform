# Render Blueprint: creates the API (Docker) and the static React site.
# MySQL is not offered by Render, so point DB_URL at a hosted MySQL (Aiven, Railway, TiDB Cloud, PlanetScale-compatible, etc.).
services:
  - type: web
    name: auction-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        sync: false          # jdbc:mysql://HOST:PORT/DBNAME?useSSL=true&serverTimezone=UTC
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # your frontend URL, e.g. https://auction-web.onrender.com
      - key: DB_POOL_SIZE
        value: "5"

  - type: web
    name: auction-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # your API URL, e.g. https://auction-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
